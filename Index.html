<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesture LED Circuit</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:16px}
button{font-size:18px;padding:12px 24px;border:0;border-radius:8px;background:#4caf50;color:#fff}
</style>
</head>
<body>
<h2> Gesture LED Circuit</h2>
<p>Open hand = LED ON, fist = LED OFF</p>
<button onclick="start()">Start camera</button>
<div id="cam" style="margin:12px"></div>
<p id="label">Waiting...</p>

<svg width="260" height="160" viewBox="0 0 260 160">
  <rect x="20" y="30" width="220" height="100" fill="none" stroke="#aaa" stroke-width="3"/>
  <rect x="10" y="60" width="20" height="40" fill="#111" stroke="#f44336" stroke-width="3"/>
  <text x="40" y="85" fill="#f44336" font-size="14">9V</text>
  <rect x="90" y="20" width="50" height="20" fill="#111" stroke="#ff9800" stroke-width="3"/>
  <circle id="led" cx="200" cy="130" r="14" fill="#333" stroke="#fff" stroke-width="2"/>
</svg>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
const MODEL_URL = "PASTE-YOUR-MODEL-LINK-HERE/";
let model, webcam;

async function start() {
  model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
  webcam = new tmImage.Webcam(250, 250, true);
  await webcam.setup();
  await webcam.play();
  document.getElementById("cam").appendChild(webcam.canvas);
  window.requestAnimationFrame(loop);
}

async function loop() {
  webcam.update();
  const preds = await model.predict(webcam.canvas);
  let best = preds[0];
  for (const p of preds) if (p.probability > best.probability) best = p;
  const on = best.className === "ON" && best.probability > 0.8;
  document.getElementById("led").setAttribute("fill", on ? "#ffeb3b" : "#333");
  document.getElementById("label").innerText =
    best.className + " (" + Math.round(best.probability * 100) + "%)";
  window.requestAnimationFrame(loop);
}
</script>
</body>
</html>
